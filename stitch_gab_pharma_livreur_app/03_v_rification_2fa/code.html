<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            border-color: #006A35;
            box-shadow: 0 0 0 2px rgba(0, 106, 53, 0.2);
            outline: none;
        }
        .numpad-active:active {
            background-color: #a8f4b9;
            transform: scale(0.95);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .error-shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d7e6de",
                        "secondary-container": "#a8f4b9",
                        "surface-dim": "#ceded5",
                        "secondary-fixed-dim": "#8cd79f",
                        "secondary": "#206b3d",
                        "surface-bright": "#eefdf4",
                        "surface-container-high": "#dcece3",
                        "on-surface-variant": "#3f4940",
                        "surface-tint": "#076d38",
                        "on-primary-container": "#8fe7a5",
                        "primary-fixed-dim": "#81d998",
                        "on-secondary-fixed": "#00210d",
                        "secondary-fixed": "#a8f4b9",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#005caa",
                        "surface-container-low": "#e8f7ef",
                        "outline": "#6f7a6f",
                        "on-secondary-container": "#287243",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#00210c",
                        "primary-fixed": "#9df6b2",
                        "inverse-surface": "#26332e",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#001c3a",
                        "tertiary-fixed-dim": "#a5c8ff",
                        "inverse-primary": "#81d998",
                        "inverse-on-surface": "#e5f4ec",
                        "background": "#eefdf4",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#bdd5ff",
                        "surface": "#eefdf4",
                        "on-primary-fixed-variant": "#005228",
                        "primary": "#004f26",
                        "on-surface": "#111e19",
                        "on-background": "#111e19",
                        "surface-container-highest": "#d7e6de",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#004481",
                        "primary-container": "#006a35",
                        "tertiary-fixed": "#d4e3ff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004786",
                        "outline-variant": "#bec9bd",
                        "surface-container": "#e2f1e9",
                        "on-secondary-fixed-variant": "#005229",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-mobile": "12px",
                        "margin-mobile": "16px",
                        "xl": "32px",
                        "base": "8px",
                        "lg": "24px",
                        "touch-target-min": "48px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "price-display": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "price-display": ["20px", {"lineHeight": "24px", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Header (Suppressed navigation but keeping identity as per task focus) -->
<header class="bg-surface shadow-sm h-16 flex items-center px-4 justify-between sticky top-0 z-50">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="font-headline-sm text-headline-sm font-bold text-primary">Gab'Pharma</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
</header>
<main class="flex-grow flex flex-col max-w-md mx-auto w-full px-margin-mobile pt-lg">
<!-- Illustration/Icon -->
<div class="flex justify-center mb-xl">
<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-[40px]" style="font-variation-settings: 'FILL' 0;">sms</span>
</div>
</div>
<!-- Headline & Instructions -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Vérification de sécurité</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Entrez le code à 6 chiffres envoyé par SMS au <span class="font-bold text-on-surface">+241 07 7x xx xx</span>
</p>
</div>
<!-- 6-Box OTP Input -->
<div class="flex justify-between gap-2 mb-md" id="otp-container">
<input class="otp-input w-12 h-14 bg-surface-container-highest border-2 border-transparent rounded-xl text-center text-headline-md font-bold focus:border-primary transition-all" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-highest border-2 border-transparent rounded-xl text-center text-headline-md font-bold focus:border-primary transition-all" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-highest border-2 border-transparent rounded-xl text-center text-headline-md font-bold focus:border-primary transition-all" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-highest border-2 border-transparent rounded-xl text-center text-headline-md font-bold focus:border-primary transition-all" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-highest border-2 border-transparent rounded-xl text-center text-headline-md font-bold focus:border-primary transition-all" maxlength="1" readonly="" type="text"/>
<input class="otp-input w-12 h-14 bg-surface-container-highest border-2 border-transparent rounded-xl text-center text-headline-md font-bold focus:border-primary transition-all" maxlength="1" readonly="" type="text"/>
</div>
<!-- Error State Text (Hidden by default) -->
<div class="hidden flex items-center justify-center gap-1 text-error mb-md" id="error-text">
<span class="material-symbols-outlined text-[18px]">report</span>
<span class="font-label-lg text-label-lg">Code incorrect</span>
</div>
<!-- Resend Section -->
<div class="flex flex-col items-center gap-2 mb-xl">
<button class="font-label-lg text-label-lg text-outline-variant flex items-center gap-2" disabled="" id="resend-btn">
                Renvoyer le code <span class="font-bold text-on-surface-variant" id="timer">0:59</span>
</button>
</div>
</main>
<!-- Numpad at Bottom -->
<div class="bg-surface-container-low p-gutter-mobile rounded-t-3xl shadow-[0_-4px_24px_rgba(0,0,0,0.05)] mt-auto">
<div class="grid grid-cols-3 gap-3 max-w-md mx-auto">
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('1')">1</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('2')">2</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('3')">3</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('4')">4</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('5')">5</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('6')">6</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('7')">7</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('8')">8</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('9')">9</button>
<div class="h-14"></div>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-headline-sm font-bold text-on-surface transition-all flex items-center justify-center" onclick="handleNum('0')">0</button>
<button class="numpad-active h-14 rounded-xl bg-surface-container-highest text-on-surface transition-all flex items-center justify-center" onclick="handleDelete()">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Primary Action (Visible when 6 digits are entered) -->
<div class="max-w-md mx-auto mt-4 px-1">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-lg text-label-lg opacity-50 cursor-not-allowed transition-all active:scale-95" id="verify-btn">
                Vérifier
            </button>
</div>
</div>
<script>
        let currentCode = "";
        const inputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verify-btn');
        const errorText = document.getElementById('error-text');
        const otpContainer = document.getElementById('otp-container');

        function updateUI() {
            inputs.forEach((input, index) => {
                input.value = currentCode[index] || "";
                if (index === currentCode.length) {
                    input.classList.add('border-primary');
                    input.classList.remove('border-transparent');
                } else {
                    input.classList.remove('border-primary');
                    input.classList.add('border-transparent');
                }
            });

            if (currentCode.length === 6) {
                verifyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                verifyBtn.disabled = false;
            } else {
                verifyBtn.classList.add('opacity-50', 'cursor-not-allowed');
                verifyBtn.disabled = true;
            }
            
            // Clear error when typing
            if (currentCode.length < 6) {
                errorText.classList.add('hidden');
                otpContainer.classList.remove('error-shake');
            }
        }

        function handleNum(num) {
            if (currentCode.length < 6) {
                currentCode += num;
                updateUI();
            }
        }

        function handleDelete() {
            if (currentCode.length > 0) {
                currentCode = currentCode.slice(0, -1);
                updateUI();
            }
        }

        // Simulating Countdown
        let timeLeft = 59;
        const timerSpan = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            timerSpan.textContent = `0:${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerSpan.textContent = "";
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-outline-variant');
                resendBtn.classList.add('text-primary');
                resendBtn.innerHTML = 'Renvoyer le code';
            }
        }, 1000);

        // Verify Logic for Demo
        verifyBtn.addEventListener('click', () => {
            if (currentCode === "123456") {
                // Success State
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                setTimeout(() => {
                    verifyBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
                    verifyBtn.classList.replace('bg-primary', 'bg-secondary');
                }, 1000);
            } else {
                // Error State
                errorText.classList.remove('hidden');
                otpContainer.classList.add('error-shake');
                inputs.forEach(input => {
                    input.classList.add('border-error');
                    setTimeout(() => input.classList.remove('border-error'), 1000);
                });
            }
        });
    </script>
</body></html>
