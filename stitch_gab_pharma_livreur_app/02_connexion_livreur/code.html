<!DOCTYPE html>

            "fontFamily": {

<style>
        body {
            background-color: #EDFDF4; /* Level 0 Background */
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0 4px 20px -2px rgba(0, 106, 53, 0.08);
        }
        .input-focus-ring:focus-within {
            border-color: #006A35;
            box-shadow: 0 0 0 1px #006A35;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Login Container -->
<div class="w-full max-w-md space-y-lg">
<!-- Logo Section -->
<div class="flex justify-center mb-xl">
<img alt="Gab'Pharma Logo" class="h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjmWN5w0WFPof7E93jn4soCSkc3dGV5BuReR7s634IWCiqBBFKoeZSOztZs97do0Ycs6HeeSHpLii3Q1XzVJkqD7vdQMWHMfs_l6nCC7M0pDb8tJ-IPHW-eu9NSUu71SFIGfR6JZVfPZa8r8obBPQ3W-a5QnWEVh5rFvRdcas6AblCA5YgExlrLKqXyK14Qf3TpP0k8dM5vsiG3RiLKaIjgIH7o74b2OoO9zbwD60p5nFVYMywnom6YsJU2lKNed2fyg"/>
</div>
<!-- Main Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg login-card">
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Connexion Livreur</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Accédez à votre espace pour gérer vos livraisons.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- ID Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-xs" for="matricule">Matricule</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant transition-all input-focus-ring group">
<span class="material-symbols-outlined ml-md text-outline">badge</span>
<input class="w-full bg-transparent border-none focus:ring-0 px-md py-touch-target-min font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="matricule" placeholder="Ex: GP-2024-88" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-xs" for="password">Mot de passe</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-outline-variant transition-all input-focus-ring group">
<span class="material-symbols-outlined ml-md text-outline">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 px-md py-touch-target-min font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="mr-md text-on-surface-variant hover:text-primary transition-colors flex items-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end pt-xs">
<a class="font-label-lg text-label-lg text-primary hover:underline transition-all" href="#">Mot de passe oublié ?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[56px] bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-sm active:scale-95 transition-transform duration-150 mt-lg" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined">login</span>
</button>
</form>
</div>
<!-- Footnote / Support -->
<div class="text-center space-y-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Besoin d'aide ? <a class="text-primary font-label-lg" href="#">Contacter le support logistique</a>
</p>
<!-- App Version or Status -->
<div class="inline-flex items-center gap-xs px-md py-xs bg-surface-variant/30 rounded-full">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Serveur Opérationnel</span>
</div>
</div>
</div>
<!-- Micro-interaction Scripts -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Simple button haptic feedback simulation
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('click', () => {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        });
    </script>
</body></html>
