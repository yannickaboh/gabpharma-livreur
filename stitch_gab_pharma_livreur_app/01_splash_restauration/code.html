<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }

<body class="min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Offline Banner (Initially Hidden) -->
<div class="hidden fixed top-0 left-0 w-full z-50 bg-error-container text-on-error-container py-3 px-4 flex items-center justify-center gap-3 shadow-md animate-in slide-in-from-top duration-300" id="offline-banner">
<span class="material-symbols-outlined text-error">cloud_off</span>
<span class="font-label-lg text-label-lg">Mode Hors Ligne : Vérifiez votre connexion internet.</span>
</div>
<!-- Main Content Area (Splash) -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-sm px-margin-mobile relative">
<!-- Subtle Ambient Background Element -->
<div class="absolute inset-0 flex items-center justify-center -z-10 opacity-20">
<div class="w-64 h-64 bg-secondary-container rounded-full blur-3xl animate-pulse-ring"></div>
</div>
<!-- Logo Container -->
<div class="mb-xl transform transition-all duration-700 ease-out scale-100 opacity-100 hover:scale-105">
<img alt="Gab'Pharma Livreur Logo" class="w-48 h-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpawJ790w39XuawDxPZMABojZoxQ0IVBY0pr5v65tFrDWUk7HjdSMXa7yBwHmaFw3MVm-p39hQxbOk1LsqB5pNHz09ARXSLrAHZhZ8XnugacS0Hv5LHa9_2nwy0OtRfe7dHkyiSR7f5nCRQK8mFGFdrbXsuioK4rf6bvV_JQa9QztbLZ45lEyaQWJR8DSjuLI8dyh8moxCGzJgjsznpOfA0s6CKxM04czOBbxDcuFkgIQBrI12BjZym9K5Ew-DBHbUWA"/>
</div>
<!-- Session Restoration State -->
<div class="flex flex-col items-center space-y-md" id="loading-state">
<!-- Loading Indicator (Material 3 style) -->
<div class="relative w-12 h-12">
<svg class="animate-spin w-full h-full text-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<p class="font-label-lg text-label-lg text-on-surface-variant tracking-wide transition-all duration-500" id="status-text">
                Vérification de la session...
            </p>
</div>
<!-- Alternative Offline/Error Controls (Hidden by Default) -->
<div class="hidden flex flex-col items-center space-y-lg mt-md" id="retry-controls">
<button class="h-touch-target-min px-xl bg-primary-container text-on-primary rounded-full font-label-lg text-label-lg shadow-lg active:scale-95 transition-transform flex items-center gap-2" onclick="simulateRetry()">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Réessayer
            </button>
</div>
</main>
<!-- Footer Information -->
<footer class="pb-xl text-center">
<p class="font-label-md text-label-md text-outline tracking-wider opacity-60">Version 1.0.4</p>
</footer>
<!-- Micro-interaction Script -->
<script>
        // Simulation logic for demonstration purposes
        const statusText = document.getElementById('status-text');
        const loadingState = document.getElementById('loading-state');
        const offlineBanner = document.getElementById('offline-banner');
        const retryControls = document.getElementById('retry-controls');

        // To toggle Offline State in demo: window.setOffline(true)
        window.setOffline = (isOffline) => {
            if (isOffline) {
                offlineBanner.classList.remove('hidden');
                statusText.innerText = "Connexion impossible";
                statusText.classList.add('text-error');
                retryControls.classList.remove('hidden');
                // stop loading circle
                document.querySelector('.animate-spin').classList.add('hidden');
            } else {
                offlineBanner.classList.add('hidden');
                statusText.innerText = "Vérification de la session...";
                statusText.classList.remove('text-error');
                retryControls.classList.add('hidden');
                document.querySelector('.animate-spin').classList.remove('hidden');
            }
        };

        function simulateRetry() {
            setOffline(false);
            setTimeout(() => {
                // Just a mock cycle
                statusText.innerText = "Authentification...";
            }, 1000);
        }

        // Initial trigger for some movement
        setTimeout(() => {
            if (!offlineBanner.classList.contains('hidden')) return;
            statusText.innerText = "Chargement des missions...";
        }, 2000);

        // Auto-show offline mode for 2 seconds to demonstrate requested alternative state, then return to normal
        // In a real app, this would be reactive to navigator.onLine
        /* 
        setTimeout(() => {
            setOffline(true);
        }, 4000);
        */
    </script>
